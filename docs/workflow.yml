name: Redo manual QA
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created, edited, deleted]
permissions:
  contents: read
  pull-requests: write
jobs:
  checklist:
    if: github.event_name == 'pull_request_target' || (github.event.issue.pull_request && (startsWith(github.event.comment.body, '/redo pass ') || startsWith(github.event.changes.body.from, '/redo pass ')))
    runs-on: ubuntu-latest
    concurrency:
      group: redo-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: Unique50101/redo@v1.0.0
        with:
          checks: |
            [
              {"id":"sessions","label":"Inspect session icons","paths":["src/vs/workbench/contrib/sessions/**"]},
              {"id":"terminal","label":"Open a terminal","paths":["src/vs/workbench/contrib/terminal/**"]}
            ]
